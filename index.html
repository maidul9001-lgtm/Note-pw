<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2b2b">
<link rel="manifest" href="manifest.json">
<script src="api/firebase-config.js"></script>
<script src="api/sync.js"></script>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="নোটপ্যাড">
<title>আমার নোটপ্যাড</title>
<style>
:root{--bg:#202020;--bar:#2b2b2b;--card:#2f2f2f;--text:#e8e8e8;--sub:#a3a3a3;--acc:#80cbc4;--accText:#0d2b28;--line:#3b3b3b;--row:#000}
:root[data-theme=light]{--bg:#f2f2f2;--bar:#ffffff;--card:#ffffff;--text:#212121;--sub:#6b6b6b;--acc:#26a69a;--accText:#fff;--line:#dcdcdc;--row:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--af,"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,Roboto,sans-serif);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;display:block}
#hd,.hd{height:56px;min-height:56px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4px 0 8px;gap:2px;padding-top:env(safe-area-inset-top,0)}
#hd{height:calc(56px + env(safe-area-inset-top,0px))}
.ttl{flex:1;font-size:22px;letter-spacing:.3px;padding-left:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.ib:active{background:rgba(128,128,128,.25)}
.ib.on{color:var(--acc)}
#hd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:18px;-webkit-user-select:text;user-select:text}
#main{flex:1;overflow-y:auto;padding:8px 8px 96px;-webkit-overflow-scrolling:touch}
.sb{background:var(--card);text-align:center;padding:12px;margin:0 0 10px;font-weight:600;font-size:16px;border-radius:2px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc{position:relative;border-radius:10px;padding:12px 12px 10px;color:#1d1d1d;min-height:110px;max-height:210px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.nc:active{filter:brightness(.92)}
.nt{font-weight:700;font-size:16px;line-height:1.3;word-break:break-word;padding-right:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb{font-size:14px;line-height:1.4;margin-top:4px;opacity:.82;word-break:break-word;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nd{font-size:11px;opacity:.65;margin-top:6px}
.pn{position:absolute;top:8px;right:8px;width:18px;height:18px;opacity:.75}
.pn svg{width:18px;height:18px}
.grid.list{grid-template-columns:1fr;gap:8px}
.list .nc{min-height:0;max-height:none;flex-direction:row;align-items:center;gap:10px;padding:10px 14px}
.list .nc .tx{flex:1;min-width:0}
.list .nb{-webkit-line-clamp:1;margin-top:2px}
.list .nd{margin-top:2px}
.fr{display:flex;align-items:center;gap:12px;background:var(--row);border:1px solid var(--line);border-radius:4px;padding:14px 8px 14px 14px;margin-bottom:10px;position:relative}
.fr:active{filter:brightness(1.25)}
.fr .fi svg{width:30px;height:30px}
.fn{flex:1;font-size:20px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb{min-width:62px;text-align:center;border-radius:20px;padding:8px 12px;font-weight:700;font-size:18px}
.fp{width:18px;height:18px;color:var(--acc)}
.fp svg{width:18px;height:18px}
.fm{width:36px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:16px;line-height:1.7}
.empty svg{width:56px;height:56px;margin:0 auto 10px;opacity:.4}
#fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--acc);color:var(--accText);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:5}
#fab svg{width:30px;height:30px}
#fab:active{transform:scale(.94)}
#nav{height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0);min-height:60px;background:var(--bar);border-top:1px solid var(--line);display:flex}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:11px}
#nav button.on{color:var(--acc)}
.ml{display:flex;align-items:center;gap:14px;padding:16px 14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;border-radius:4px}
.ml .t{flex:1;font-size:16px}
.ml .s{font-size:13px;color:var(--sub);margin-top:2px}
.ml .v{color:var(--acc);font-weight:600;font-size:14px}
.ml svg{color:var(--acc)}
.st{display:flex;gap:8px;margin-bottom:12px}
.st div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:center}
.st b{display:block;font-size:26px;color:var(--acc)}
.st span{font-size:13px;color:var(--sub)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end}
.ov.c{align-items:center;justify-content:center;padding:20px}
.sh{width:100%;background:var(--bar);border-radius:18px 18px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px));max-height:75%;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sht{padding:12px 18px;font-weight:700;font-size:17px}
.si{display:flex;align-items:center;gap:16px;padding:14px 18px;font-size:16px}
.si:active{background:rgba(128,128,128,.2)}
.si svg{color:var(--sub)}
.si.red{color:#ef6c6c}.si.red svg{color:#ef6c6c}
.dlg{width:100%;max-width:420px;background:var(--bar);border-radius:16px;padding:16px;animation:up .18s ease-out}
.dlg input,.dlg textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:16px;outline:0;margin:6px 0 12px;-webkit-user-select:text;user-select:text}
.dlg input:focus,.dlg textarea:focus{border-color:var(--acc)}
.dlg textarea{height:150px;resize:none;font-size:12px;font-family:monospace}
.dlg p{margin:6px 0 14px;line-height:1.6;color:var(--sub)}
.sw{display:flex;flex-wrap:wrap;gap:12px;padding:6px 14px 14px}
.dlg .sw{padding:0 0 14px}
.sw i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid transparent;color:#222}
.sw i.on{border-color:var(--text)}
.sw i svg{width:20px;height:20px}
.bt{display:flex;justify-content:flex-end;gap:8px}
.bt button{padding:10px 18px;border-radius:10px;font-weight:600;color:var(--sub)}
.bt .pri{background:var(--acc);color:var(--accText)}
.bt .red{color:#ef6c6c}
#ed{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#ed.on{display:flex}
.sp{flex:1}
#ecbar{height:5px}
#et{background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:22px;font-weight:700;padding:14px 16px 6px;-webkit-user-select:text;user-select:text}
#eb{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;line-height:1.65;padding:6px 16px;resize:none;-webkit-user-select:text;user-select:text}
.ef{display:flex;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--sub);border-top:1px solid var(--line);background:var(--bar)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#444;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* গ্রিড ৩ কলাম */
.grid.g3{grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .nc{min-height:92px;max-height:170px;padding:9px 9px 8px;border-radius:8px}
.g3 .nt{font-size:14px;padding-right:14px;-webkit-line-clamp:2}
.g3 .nb{font-size:12px;-webkit-line-clamp:3}
.g3 .nd{font-size:10px}
.g3 .pn,.g3 .pn svg{width:14px;height:14px;top:6px;right:6px}
/* লিস্ট – বড় */
.list.lb .nc{padding:18px 16px;gap:12px}
.list.lb .nt{font-size:19px;-webkit-line-clamp:2}
.list.lb .nb{font-size:15px;-webkit-line-clamp:3;margin-top:6px}
.list.lb .nd{font-size:12px;margin-top:8px}
/* লিস্ট – ছোট */
.list.ls{gap:5px}
.list.ls .nc{padding:7px 12px;border-radius:7px}
.list.ls .tx{display:flex;align-items:baseline;gap:8px}
.list.ls .nt{font-size:14px;padding-right:0;-webkit-line-clamp:1;flex:1;min-width:0}
.list.ls .nb{display:none}
.list.ls .nd{font-size:10px;margin-top:0;white-space:nowrap}
.list.ls .pn{position:static;order:2;width:14px;height:14px}
.list.ls .pn svg{width:14px;height:14px}
/* পিন করা / সাধারণ নোটের বিভাগ */
.sec{display:flex;align-items:center;gap:8px;margin:6px 4px 8px;font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.2px}
.sec svg{width:16px;height:16px}
.sec em{font-style:normal;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.sec.pin{color:var(--acc)}
.grid+.sec{margin-top:18px}
.nc.pinned{box-shadow:0 0 0 2px var(--acc),0 2px 6px rgba(0,0,0,.3)}
/* অপশন পপআপ */
.dlg.opt{padding:0;max-width:380px;border-radius:26px;overflow:hidden}
.otabs{display:flex;border-bottom:1px solid var(--line)}
.otabs button{flex:1;padding:16px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.otabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.otabs svg{width:26px;height:26px}
.obody{max-height:60vh;overflow-y:auto;padding:6px 0 10px}
.oi{display:flex;align-items:center;gap:18px;padding:14px 24px;font-size:17px;font-weight:600}
.oi span{flex:1}
.oi:active{background:rgba(128,128,128,.2)}
.oi svg{color:var(--sub)}
.oi.on{color:var(--acc)}
.oi.on svg{color:var(--acc)}
.sq{display:block;width:26px;height:26px;border-radius:4px;flex:none}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.fdot{position:absolute;top:7px;right:6px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bar)}
@keyframes inl{from{transform:translateX(-36px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inr{from{transform:translateX(36px);opacity:.2}to{transform:none;opacity:1}}
:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
#de{position:fixed;inset:0;background:var(--bg);z-index:51;display:none;flex-direction:column}
#de.on{display:flex}
#decbar{height:5px;background:linear-gradient(90deg,#ba68c8,#4fc3f7)}
#dt{background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:22px;font-weight:700;padding:14px 16px 6px;-webkit-user-select:text;user-select:text}
#db{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;line-height:1.65;padding:6px 16px;resize:none;-webkit-user-select:text;user-select:text}
.dc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid #ba68c8;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dc:active{filter:brightness(1.2)}
.dm{font-size:28px;line-height:1.1}
.dx{flex:1;min-width:0}
.dt{font-weight:700;font-size:16px;word-break:break-word}
.db2{font-size:14px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.dtm{font-size:11px;color:var(--sub);margin-top:5px}
.dc+.sec{margin-top:18px}
.mds{display:flex;flex-wrap:wrap;gap:10px;padding:6px 16px 16px}
.mds i{font-style:normal;font-size:32px;width:56px;height:56px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center}
.mds i.on{outline:2px solid var(--acc)}
#nav button{min-width:0}
#ecbar,#decbar{display:none}
.hd #et,.hd #dt{flex:1;min-width:0;height:42px;border-radius:10px;background:rgba(128,128,128,.2);padding:0 12px;margin:0 4px;font-size:18px;font-weight:700}
#ed .hd{border-bottom:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#ed .hd .ib{color:#1d1d1d}
#ed .hd #et{color:#1d1d1d;background:rgba(255,255,255,.7)}
#ed .hd #et::placeholder{color:#555}
#eb,#db{padding-top:14px}
.bk{flex:1;min-width:0;height:46px;border-radius:23px;display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;color:var(--text);text-align:left;transition:opacity .18s}
.bk:active{background:rgba(128,128,128,.22)}
.bk span{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd.hold .bk{opacity:0}
.flyrow{position:fixed;margin:0!important;z-index:60;pointer-events:none;overflow:hidden;box-sizing:border-box}
@keyframes liftIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#main.an-up{animation:liftIn .4s .08s both cubic-bezier(.2,.8,.2,1)}
#main.an-dn{animation:fadeIn .3s both}
.fr{transition:transform .12s}
.fr:active{transform:scale(.985)}
/* সমান মাপের কার্ড */
.grid{--bh:132px}
.grid.g3{--bh:112px}
.grid.list.lb{--bh:124px}
.grid.list.lm{--bh:80px}
.grid.list.ls{--bh:46px}
.grid .nc{height:calc(var(--bh)*var(--cs,1));min-height:0;max-height:none}
.grid .nt{font-size:calc(16px*var(--fs,1))}
.grid.g3 .nt{font-size:calc(14px*var(--fs,1))}
.grid.list.lb .nt{font-size:calc(19px*var(--fs,1))}
.grid.list.ls .nt{font-size:calc(14px*var(--fs,1))}
.grid .nb{font-size:calc(14px*var(--fs,1));display:block;-webkit-line-clamp:unset;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.grid.g3 .nb{font-size:calc(12px*var(--fs,1))}
.grid.list.lb .nb{font-size:calc(15px*var(--fs,1))}
.grid .nd{font-size:calc(11px*var(--fs,1))}
.grid.g3 .nd{font-size:calc(10px*var(--fs,1))}
.list .nc .tx{display:flex;flex-direction:column;justify-content:center;height:100%;overflow:hidden}
.list.lm .nt{-webkit-line-clamp:1}
.list.ls .tx{flex-direction:row;align-items:baseline;justify-content:flex-start}
.list.ls .nb{display:none}
/* সিলেকশন */
.nc{transition:transform .12s}
.ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.45);background:rgba(255,255,255,.55);color:#0d2b28;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.nc.sel{outline:3px solid var(--acc);outline-offset:-3px;transform:scale(.97)}
.nc.sel .ck{background:var(--acc);border-color:var(--acc);color:var(--accText)}
.selmode .pn{right:38px}
.list.ls .ck{top:50%;transform:translateY(-50%)}
.ib.sm{width:40px;height:44px}
/* ট্রাশ ও আকার সেটিং */
.th{font-size:13px;color:var(--sub);margin:2px 4px 12px;line-height:1.6}
.tcard{border-radius:10px;padding:12px 14px;margin-bottom:8px;color:#1d1d1d;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tcard:active{filter:brightness(.92)}
.tcard .nt{font-weight:700;font-size:16px;word-break:break-word}
.tcard .nb{font-size:14px;opacity:.8;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.tcard .nd{font-size:11px;opacity:.65;margin-top:5px}
.tcard.dtr{background:var(--card);color:var(--text);border:1px solid var(--line);border-left:4px solid #ba68c8;box-shadow:none}
.rs{width:100%;accent-color:var(--acc);margin:8px 0 14px}
.szh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.szh b{color:var(--acc)}
.rb{margin-top:12px;padding:10px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600}
#main .grid .nc{cursor:pointer}
/* এডিটরের বডি = নোটের রং */
#ed #eb{color:#1d1d1d}
#ed #eb::placeholder{color:rgba(0,0,0,.42)}
#ed .ef{background:transparent;color:rgba(0,0,0,.62);border-top:1px solid rgba(0,0,0,.14)}
.sw i[data-c="#ffffff"]:not(.on){border-color:#9e9e9e}
.sq[style*="#ffffff"]{border:1px solid #9e9e9e}
/* সাদা নোট: লাইটে সাদা, ডার্কে কালো */
:root{--white:#ffffff;--wt:#1d1d1d;--wh:#ececec;--wb:#ffffff}
.nc.wn,.tcard.wn{color:var(--wt);border:1px solid rgba(128,128,128,.4)}
#ed.wn #eb{color:var(--wt)}
#ed.wn #eb::placeholder{color:rgba(128,128,128,.8)}
#ed.wn .hd .ib{color:var(--wt)}
#ed.wn .hd #et{color:var(--wt);background:rgba(128,128,128,.2)}
#ed.wn .hd #et::placeholder{color:rgba(128,128,128,.9)}
#ed.wn .ef{color:var(--sub);border-top-color:var(--line)}
/* লাইন টানা কাগজ + কালো নোট */
#ed #eb{line-height:28px;padding:6px 16px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--ln,rgba(0,0,0,.15)) 27px,var(--ln,rgba(0,0,0,.15)) 28px);background-attachment:local;background-position:0 6px;background-repeat:repeat}
#ed.nolines #eb{background-image:none}
#ed.wn{--ln:rgba(128,128,128,.35)}
#ed.kn{--ln:rgba(255,255,255,.22)}
#ed.kn #eb{color:#f2f2f2}
#ed.kn #eb::placeholder{color:rgba(255,255,255,.45)}
#ed.kn .hd .ib{color:#f2f2f2}
#ed.kn .hd #et{color:#f2f2f2;background:rgba(255,255,255,.16)}
#ed.kn .hd #et::placeholder{color:rgba(255,255,255,.55)}
#ed.kn .ef{color:rgba(255,255,255,.65);border-top-color:rgba(255,255,255,.18)}
.nc.kn,.tcard.kn{color:#f2f2f2;border:1px solid rgba(255,255,255,.18)}
.sw i[data-c="#000000"]{color:#fff}
.sw i[data-c="#000000"]:not(.on){border-color:#777}
.sq[style*="#000000"]{border:1px solid #777}
/* তারিখ-সময় সব কার্ডে সবসময় দেখাবে */
.grid.g2 .nc .tx,.grid.g3 .nc .tx{display:flex;flex-direction:column;height:100%;min-width:0;overflow:hidden}
.grid .nc .nt{flex:none}
.grid .nc .nb{flex:1 1 0;min-height:0}
.grid .nc .nd{flex:none}

const I=new Proxy({},{get:(_,k)=>`<svg viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`});

/* ---------- ডেটা ---------- */
const COLORS=['#fff176','#4fc3f7','#aed581','#f48fb1','#b39ddb','#ffb74d','#80cbc4','#b0bec5','#ffffff','#000000','#fcf6bd'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const d=JSON.parse(localStorage.getItem('mynotepad'));if(d&&Array.isArray(d.notes))return d}catch(e){}return{notes:[],folders:[],set:{}}}
/* ---------- দ্রুত স্টোরেজ (IndexedDB): শুধু বদলানো নোট লেখা হয় ---------- */
let idb=null,storeMigrated=false;
const pcache={notes:new Map(),diary:new Map(),kv:new Map()};
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('no idb'));
  const r=indexedDB.open('notepad-v2',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('notes',{keyPath:'id'});d.createObjectStore('diary',{keyPath:'id'});d.createObjectStore('kv')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
})}
const idbReq=(st,m)=>new Promise((res,rej)=>{const q=idb.transaction(st)['objectStore'](st)[m]();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function loadStore(){
  try{
    idb=await idbOpen();
    const[notes,diary,keys,vals]=await Promise.all([idbReq('notes','getAll'),idbReq('diary','getAll'),idbReq('kv','getAllKeys'),idbReq('kv','getAll')]);
    if(keys.includes('meta')){
      const d={notes,diary},kv={};keys.forEach((k,i)=>{kv[k]=vals[i]});
      Object.keys(kv).forEach(k=>{if(k!=='meta'&&k!=='__order'){d[k]=kv[k]}});
      const ord=kv.__order;
      if(ord){['notes','diary'].forEach(st=>{
        const pos=new Map((ord[st]||[]).map((id,i)=>[id,i]));
        d[st].sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(b.id)?pos.get(b.id):1e9));
      })}
      notes.forEach(n=>pcache.notes.set(n.id,JSON.stringify(n)));
      diary.forEach(n=>pcache.diary.set(n.id,JSON.stringify(n)));
      keys.forEach((k,i)=>pcache.kv.set(k,JSON.stringify(vals[i])));
      return d;
    }
    storeMigrated=true; /* আগের localStorage ডাটা প্রথমবার সরানো হবে */
  }catch(e){console.error(e);idb=null}
  return load();
}
let S=await loadStore();
S.folders=S.folders||[];
S.diary=S.diary||[];S.fonts=S.fonts||[];
S.trash=S.trash||[];
S.set=Object.assign({cs:100,fs:100,diary:true,start:'notes',view:'g2',sort:'updated',fsort:'color',theme:'auto',lines:true,lastColor:COLORS[0]},S.set||{});
/* নতুন ইনস্টলে কোনো নমুনা নোট বা ফোল্ডার থাকে না */
if(S.set.view==='grid')S.set.view='g2';

if(!['g2','g3','lb','lm','ls'].includes(S.set.view))S.set.view='g2';
const QP=new URLSearchParams(location.search);
const ymdOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dlabel=k=>{try{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'})}catch(e){return k}};
let pT=0,pBusy=false,pAgain=false;
function save(){
  if(!idb){try{localStorage.setItem('mynotepad',JSON.stringify(S))}catch(e){toast('সংরক্ষণ করা যায়নি')}return}
  clearTimeout(pT);pT=setTimeout(persist,250);
  schedSync();
}
async function persist(){
  if(!idb)return;
  if(pBusy){pAgain=true;return}
  pBusy=true;
  try{
    const ops=[],pend=[];
    for(const[st,arr]of[['notes',S.notes],['diary',S.diary]]){
      const cm=pcache[st],seen=new Set();
      for(const n of arr){seen.add(n.id);const j=JSON.stringify(n);if(cm.get(n.id)!==j){ops.push([st,n,null]);pend.push([cm,n.id,j])}}
      for(const id of cm.keys())if(!seen.has(id)){ops.push([st,null,id]);pend.push([cm,id,undefined])}
    }
    const kv={};
    Object.keys(S).forEach(k=>{if(k!=='notes'&&k!=='diary'&&typeof S[k]!=='function')kv[k]=S[k]});
    kv.__order={notes:S.notes.map(n=>n.id),diary:S.diary.map(n=>n.id)};kv.meta=1;
    for(const k in kv){const j=JSON.stringify(kv[k]);if(pcache.kv.get(k)!==j){ops.push(['kv',kv[k],k]);pend.push([pcache.kv,k,j])}}
    if(ops.length){
      await new Promise((res,rej)=>{
        const tx=idb.transaction(['notes','diary','kv'],'readwrite');
        for(const o of ops){
          if(o[0]==='kv')tx.objectStore('kv').put(o[1],o[2]);
          else if(o[1])tx.objectStore(o[0]).put(o[1]);
          else tx.objectStore(o[0]).delete(o[2]);
        }
        tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
      });
      for(const[m,k,j]of pend){if(j===undefined)m.delete(k);else m.set(k,j)}
    }
  }catch(e){console.error(e);toast('সংরক্ষণ করা যায়নি')}
  pBusy=false;
  if(pAgain){pAgain=false;persist()}
}

const ui={tab:'home',folder:null,searching:false,q:'',df:null,dd:null};
const fmt=t=>{try{return new Date(t).toLocaleString('bn-BD',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return new Date(t).toLocaleString()}};
const num=n=>{try{return Number(n).toLocaleString('bn-BD')}catch(e){return n}};
const bnum=n=>{try{return Number(n).toLocaleString('bn-BD',{useGrouping:false})}catch(e){return n}};
const fById=id=>S.folders.find(f=>f.id===id);
const fName=id=>id==='none'||!id?'অশ্রেণিবদ্ধ':(fById(id)||{}).name||'অশ্রেণিবদ্ধ';
const nF=n=>Array.isArray(n.folders)?n.folders:(n.folder?[n.folder]:[]);

function openFolder(id,row){

  ui.folder=id;ui.tab='folders';render();$('#main').scrollTop=0;mainAnim('an-up');
  if(!c)return;
  hd.classList.add('hold');
  const T={left:'0px',top:hdR.top+'px',width:innerWidth+'px',height:hdR.height+'px'};
  const a=c.animate([
    {left:f.left+'px',top:f.top+'px',width:f.width+'px',height:f.height+'px',opacity:1},
    {...T,opacity:1,offset:.7},
    {...T,opacity:0}
  ],{duration:440,easing:'cubic-bezier(.22,.8,.25,1)',fill:'forwards'});

function vsInit(){
  const m=$('#main'),grids=[...m.querySelectorAll('.grid[data-vg]')];
  vs.grids=grids;vs.wins=grids.map(()=>({r0:0,r1:-1,empty:true}));

  g0.innerHTML=noteCard(vs.segs[0].notes[0],vs.pk);
  const cs=getComputedStyle(g0),H=g0.firstElementChild.getBoundingClientRect().height;
  vs.cols=Math.max(1,String(cs.gridTemplateColumns).trim().split(/\s+/).length);
  vs.gap=parseFloat(cs.rowGap)||0;

function vsUpdate(force){
  if(!vs||!vs.grids)return;
  const m=$('#main'),mt=m.getBoundingClientRect().top,st=m.scrollTop,vh=m.clientHeight,rh=vs.rowH;
  const tops=vs.grids.map(g=>g.getBoundingClientRect().top-mt+st);
  vs.grids.forEach((g,i)=>{
    const rows=vsRows(i),w=vs.wins[i];
    const need0=Math.max(0,Math.floor((st-tops[i])/rh)),need1=Math.min(rows-1,Math.floor((st+vh-tops[i])/rh));
    if(need1<need0){

      return;
    }
    if(!force&&!w.empty&&need0>=w.r0&&need1<=w.r1)return;
    const B=Math.ceil(vh*1.2/rh)+1,r0=Math.max(0,need0-B),r1=Math.min(rows-1,need1+B);
    vsPad(g,i,r0,r1);

function applySyncChanges(ch){

    const c=ch[k];if(!c||(!c.upsert.length&&!c.remove.length))return;
    const arr=S[k],idx=new Map(arr.map((r,i)=>[r.id,i]));

async function doRealSync(){

const dTitle=x=>x.title||(x.body||'').split('\n')[0]||'শিরোনামহীন';
const dPrev=x=>x.title?(x.body||''):(x.body||'').split('\n').slice(1).join('\n');
function diaryCard(x){
  const [y,m,d]=x.date.split('-').map(Number),dt=new Date(y,m-1,d);
  const pv=dPrev(x).slice(0,140);
  let tm='';try{tm=new Date(x.updated).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})}catch(e){}
  return`<div class="dpc" data-act="dentry" data-lp="diary" data-id="${x.id}"><i class="dh1"></i><i class="dh2"></i><div class="dpd"><b>${bnum(d)}</b><span>${dt.toLocaleDateString('bn-BD',{month:'short'})}</span><em>${dt.toLocaleDateString('bn-BD',{weekday:'short'})}</em></div><div class="dpx"><div class="dpt">${esc(dTitle(x))}</div>${pv.trim()?`<div class="dpp">${esc(pv)}</div>`:''}<div class="dpm">${tm}</div></div></div>`;
}
function diaryHTML(list,grouped,cover){
  const a=[...list].sort((x,y)=>y.date.localeCompare(x.date)||y.created-x.created);
  if(!grouped)return a.map(diaryCard).join('');
  let out='',last='';
  if(cover)out+=`<div class="dcover"><div class="dc-t">আমার ডাইরি</div><div class="dc-s">${bnum(list.length)}টি পাতা লেখা হয়েছে</div></div>`;
  a.forEach(x=>{
    const k=x.date.slice(0,7);
    if(k!==last){last=k;const[y,m]=k.split('-').map(Number);out+=`<div class="dmon"><span>${new Date(y,m-1,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</span><em>${bnum(a.filter(z=>z.date.slice(0,7)===k).length)}টি পাতা</em></div>`}
    out+=diaryCard(x);
  });
  return out;
}
/* ---------- ট্রাশ ---------- */
function toTrash(kind,obj){
  if(kind==='note')S.notes=S.notes.filter(x=>x.id!==obj.id);else S.diary=S.diary.filter(x=>x.id!==obj.id);
  delete obj._new;
  S.trash.push({id:uid(),kind,data:obj,at:Date.now()});
}
function trashHTML(){
  if(!S.trash.length)return emptyHTML('ট্রাশ খালি।<br>মুছে ফেলা নোট ও ডাইরি এখানে জমা থাকবে।');
  return`<div class="th">মুছে ফেলা আইটেম এখানে থাকে। এখান থেকে মুছলে তবেই স্থায়ীভাবে মুছে যাবে। নোটে চাপলে নোটটা দেখা যাবে (বদলানো যাবে না), তিন ডটে পুনরুদ্ধার বা স্থায়ী মুছুন। ডাইরিতে চাপলে অপশন আসবে।</div>`
   +[...S.trash].sort((a,b)=>b.at-a.at).map(t=>{
    const d=t.data;
    if(t.kind==='note')return`<div class="tcard ${d.color==='#ffffff'?'wn':''} ${d.color==='#000000'?'kn':''}" data-act="trit" data-id="${t.id}" style="background:${bodyOf(d.color)};border:1px solid ${lineOf(d.color)}"><div class="nt">${esc(noteTitle(d))}</div><div class="nb">${esc(notePrev(d).slice(0,100))}</div><div class="nd">নোট • মুছেছেন ${fmt(t.at)}</div></div>`;
    return`<div class="tcard dtr" data-act="trit" data-id="${t.id}"><div class="nt">${esc(dTitle(d))}</div><div class="nb">${esc(dPrev(d).slice(0,100))}</div><div class="nd">ডাইরি • মুছেছেন ${fmt(t.at)}</div></div>`;
  }).join('');
}
function trashItemSheet(id){
  const t=S.trash.find(x=>x.id===id);if(!t)return;
  sheet(t.kind==='note'?noteTitle(t.data).slice(0,40):dTitle(t.data).slice(0,40),[
    {t:'পুনরুদ্ধার করুন',ic:'up',f:()=>{
      if(t.kind==='note'){setNF(t.data,nF(t.data));S.notes.push(t.data)}else S.diary.push(t.data);
      S.trash=S.trash.filter(x=>x!==t);save();render();toast('পুনরুদ্ধার করা হয়েছে');
    }},
    {t:'স্থায়ীভাবে মুছুন',ic:'del',red:1,f:()=>cfm('এটি স্থায়ীভাবে মুছে যাবে, আর ফেরত আনা যাবে না। মুছবেন?','স্থায়ী মুছুন',()=>{S.trash=S.trash.filter(x=>x!==t);save();render();toast('স্থায়ীভাবে মুছে ফেলা হয়েছে')})}
  ]);
}
/* ---------- সিলেকশন (লং প্রেস) ---------- */
function exitSel(){if(ui.sel)closeLayer()}
function startSel(id){
  if(ui.sel){toggleSel(id);return}
  ui.sel=new Set([id]);
  openLayer(()=>{ui.sel=null;render()});
  if(document.querySelector('#main .nc[data-id="'+id+'"]'))selUI();else render();
}
function selUI(){
  const m=$('#main');m.classList.toggle('selmode',!!ui.sel);
  m.querySelectorAll('.nc[data-id]').forEach(el=>{
    const on=!!ui.sel&&ui.sel.has(el.dataset.id);
    el.classList.toggle('sel',on);
    let ck=el.querySelector('.ck');
    if(ui.sel){if(!ck){ck=document.createElement('span');ck.className='ck';el.insertBefore(ck,el.firstChild)}ck.textContent=on?'✓':''}
    else if(ck)ck.remove();
  });
  renderHeader();
  $('#fab').style.display=(ui.searching||ui.sel||ui.tab==='menu'||ui.tab==='trash'||ui.tab==='archive')?'none':'flex';
}
function toggleSel(id){
  if(!ui.sel)return;
  if(ui.sel.has(id))ui.sel.delete(id);else ui.sel.add(id);
  const el=document.querySelector('#main .nc[data-id="'+id+'"]');
  if(el){const on=ui.sel.has(id);el.classList.toggle('sel',on);const ck=el.querySelector('.ck');if(ck)ck.textContent=on?'✓':''}
  renderHeader();
}
const selNotes=()=>S.notes.filter(n=>ui.sel&&ui.sel.has(n.id));
function selAll(){
  const ids=vs?vs.segs.flatMap(sg=>sg.notes.map(n=>n.id)):[...document.querySelectorAll('#main .nc[data-id]')].map(e=>e.dataset.id);
  const all=ids.length&&ids.every(i=>ui.sel.has(i));
  ui.sel=new Set(all?[]:ids);selUI();
}
function selDelete(){
  const a=selNotes();if(!a.length){toast('কোনো নোট নির্বাচিত নেই');return}
  a.forEach(n=>toTrash('note',n));save();exitSel();toast(num(a.length)+'টি নোট ট্রাশে পাঠানো হয়েছে');
}
function selColor(){
  if(!selNotes().length){toast('কোনো নোট নির্বাচিত নেই');return}
  pickColor(null,c=>{const a=selNotes();a.forEach(n=>n.color=c);save();exitSel();toast(num(a.length)+'টি নোটের রং বদলেছে')});
}
function selFolder(){
  if(!selNotes().length){toast('কোনো নোট নির্বাচিত নেই');return}
  foldersPicker([],fa=>{const a=selNotes();a.forEach(n=>setNF(n,fa));save();exitSel();toast(num(a.length)+'টি নোটের ফোল্ডার ঠিক হয়েছে')});
}
function selMore(){
  const a=selNotes();if(!a.length){toast('কোনো নোট নির্বাচিত নেই');return}
  const aH=a.every(n=>n.hpin),aF=a.every(n=>n.pin),aA=a.every(n=>n.archived);
  popMenu($('[data-act="selmore"]'),[
    {t:aH?'হোম থেকে পিন সরান':'হোমে পিন করুন',ic:'pin',f:()=>{a.forEach(n=>n.hpin=!aH);save();exitSel()}},
    {t:aF?'ফোল্ডার থেকে পিন সরান':'ফোল্ডারে পিন করুন',ic:'pin',f:()=>{a.forEach(n=>n.pin=!aF);save();exitSel()}},
    {t:aA?'আর্কাইভ থেকে ফেরান':'আর্কাইভ করুন',ic:aA?'unarchive':'archive',f:()=>{
      a.forEach(n=>{n.archived=!aA;if(!aA)n.hpin=false});
      save();exitSel();
      toast(num(a.length)+(aA?'টি নোট আর্কাইভ থেকে ফেরানো হয়েছে':'টি নোট আর্কাইভে রাখা হয়েছে'));
    }}
  ]);

function sortLabel(){return SORT_L[S.set.sort]+(S.set.cf?` • <i class="dot" style="background:${S.set.cf}"></i> ${CNAME[S.set.cf]}`:'')}
/* কার্ডে শুধু পুরো লাইন দেখাবে, আধকাটা লাইন নয় */
function fitCards(root){
  const nbs=[...(root||document).querySelectorAll('#main .grid:not(.ls) .nc .nb')];
  nbs.forEach(nb=>{nb.style.display='';nb.style.webkitLineClamp='unset'});
  const rs=nbs.map(nb=>[parseFloat(getComputedStyle(nb).lineHeight),nb.clientHeight]);
  nbs.forEach((nb,i)=>{
    const lh=rs[i][0],n=lh>0?Math.floor((rs[i][1]+1)/lh):1;
    if(n<1){nb.style.display='none'}
    else nb.style.webkitLineClamp=String(n);
  });
}
addEventListener('resize',()=>fitCards());
function renderBody(){
  const m=$('#main');let h='';vs=null;
  const sig=[ui.tab,ui.folder,ui.df,ui.dd,ui.searching?ui.q:'',S.set.cf,S.set.view].join('|');
  const keepTop=vsSig===sig?m.scrollTop:0;
  if(ui.searching){
    const q=ui.q.trim().toLowerCase();
    if(!q)h=emptyHTML('শিরোনাম বা লেখার অংশ লিখে খুঁজুন');
    else{
      if(ui.tab==='diary'){
        const r=S.diary.filter(x=>lowOf(x).includes(q));
        h=r.length?diaryHTML(r,true):emptyHTML('কিছু পাওয়া যায়নি');
      }else{
      const r=S.notes.filter(n=>lowOf(n).includes(q));
      h=r.length?notesHTML(sortNotes(r,null),null):emptyHTML('কিছু পাওয়া যায়নি');
      }
    }
  }else if(ui.tab==='diary'){
    if(ui.dd){
      const l=S.diary.filter(x=>x.date===ui.dd),nc=S.notes.filter(n=>n.date===ui.dd).length;
      h=(nc?`<div class="ml" data-act="dnotes">${I.note}<div class="t">এই তারিখে ${num(nc)}টি নোট আছে<div class="s">দেখতে চাপুন</div></div></div>`:'')+(l.length?diaryHTML(l,false):emptyHTML('এই তারিখে কোনো ডাইরি নেই।<br>নিচের + চেপে লিখুন।'));
    }else h=S.diary.length?diaryHTML(S.diary,true,true):emptyHTML('এখনো কোনো ডাইরি লেখা হয়নি।<br>নিচের + চেপে আজকের কথা লিখুন।');
  }else if(ui.tab==='archive'){
    const arr=S.notes.filter(n=>n.archived);
    h=arr.length?notesHTML(sortNotes(arr,null),null):emptyHTML('আর্কাইভে কোনো নোট নেই।<br>নোটের মেনু থেকে "আর্কাইভ করুন" দিলে এখানে জমা থাকবে।');
  }else if(ui.tab==='trash')h=trashHTML();
  else if(ui.tab==='menu')h=menuHTML();
  else if(ui.tab==='folders'&&ui.folder==null)h=foldersHTML();
  else if(ui.tab==='folders'){
    const showA=S.set.farch!==false;
    const all=S.notes.filter(n=>inFolder(n,ui.folder)&&(showA||!n.archived));
    const arr=S.set.cf?all.filter(n=>n.color===S.set.cf):all;
    const live=arr.filter(n=>!n.archived),arch=arr.filter(n=>n.archived);
    h=(arr.length?notesHTML(sortNotes(live,'pin'),'pin',sortNotes(arch,null)):emptyHTML(all.length?'এই রঙের কোনো নোট নেই।':'এই ফোল্ডারে কোনো নোট নেই।<br>নিচের + চেপে নোট লিখুন।'));
  }else{
    const live=S.notes.filter(n=>!n.archived),base=ui.df?live.filter(n=>n.date===ui.df):live;
    const arr=S.set.cf?base.filter(n=>n.color===S.set.cf):base;
    h=(arr.length?notesHTML(sortNotes(arr,'hpin'),'hpin'):emptyHTML(base.length?'এই রঙের কোনো নোট নেই।':(ui.df?'এই তারিখে কোনো নোট নেই।<br>নিচের + চেপে এই তারিখের নোট লিখুন।':'এখনো কোনো নোট নেই।<br>নিচের + চেপে প্রথম নোট লিখুন।')));
  }
  m.innerHTML=h;
  m.classList.toggle('selmode',!!ui.sel);
  m.classList.toggle('mn',ui.tab==='menu');
  vsSig=sig;
  if(vs){vsInit();m.scrollTop=keepTop;vsUpdate(true)}else fitCards();
}

/* ---------- ছোট UI সরঞ্জাম ---------- */
let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function ov(html,center){
  const el=document.createElement('div');el.className='ov'+(center?' c':'');el.innerHTML=html;document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target===el)closeLayer()});
  openLayer(()=>el.remove());return el;
}
function sheet(title,items){
  const el=ov(`<div class="sh"><div class="sht">${esc(title)}</div>${items.map((it,i)=>`<div class="si ${it.red?'red':''}" data-i="${i}">${it.ic?I[it.ic]:''}<span>${esc(it.t)}</span></div>`).join('')}</div>`);
  el.addEventListener('click',e=>{const s=e.target.closest('.si');if(!s)return;const it=items[s.dataset.i];closeLayer();setTimeout(it.f,140)});
}
function cfm(msg,yesLabel,onYes){
  const el=ov(`<div class="dlg"><p style="color:var(--text);font-size:16px">${msg}</p><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="red">${yesLabel}</button></div></div>`,true);
  el.addEventListener('click',e=>{const x=e.target.dataset.x;if(x==='n')closeLayer();if(x==='y'){closeLayer();setTimeout(onYes,140)}});
}
function swatches(cur){return COLORS.map(c=>`<i data-c="${c}" class="${c===cur?'on':''}" style="background:${c}">${c===cur?I.check:''}</i>`).join('')}
function pickColor(cur,cb){
  const el=ov(`<div class="sh"><div class="sht">রঙ বেছে নিন</div><div class="sw">${swatches(cur)}</div></div>`);
  el.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(!c)return;closeLayer();setTimeout(()=>cb(c.dataset.c),140)});
}
function folderDialog(f){
  let col=f?f.color:COLORS[6];
  const el=ov(`<div class="dlg"><div class="sht" style="padding:0 0 4px">${f?'ফোল্ডার সম্পাদনা':'নতুন ফোল্ডার'}</div><input id="fnm" maxlength="40" placeholder="ফোল্ডারের নাম" value="${esc(f?f.name:'')}" autocomplete="off"><div class="sw">${swatches(col)}</div><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="pri">সংরক্ষণ</button></div></div>`,true);
  const inp=el.querySelector('#fnm');setTimeout(()=>inp.focus(),200);
  el.addEventListener('click',e=>{
    const c=e.target.closest('[data-c]');
    if(c){col=c.dataset.c;el.querySelector('.sw').innerHTML=swatches(col);return}
    const x=e.target.dataset.x;
    if(x==='n')closeLayer();
    if(x==='y'){
      const name=inp.value.trim();if(!name){toast('নাম লিখুন');return}
      if(f){f.name=name;f.color=col}else S.folders.push({id:uid(),name,color:col,pin:false,created:Date.now()});
      save();closeLayer();render();
    }
  });
}
function folderPicker(cur,cb){
  const items=[{t:'অশ্রেণিবদ্ধ',ic:'folder',f:()=>cb(null)}];
  S.folders.forEach(f=>items.push({t:f.name,ic:'folder',f:()=>cb(f.id)}));
  items.push({t:'নতুন ফোল্ডার...',ic:'plus',f:()=>{
    const el=ov(`<div class="dlg"><div class="sht" style="padding:0 0 4px">নতুন ফোল্ডার</div><input id="fnm2" maxlength="40" placeholder="ফোল্ডারের নাম" autocomplete="off"><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="pri">তৈরি করুন</button></div></div>`,true);
    const inp=el.querySelector('#fnm2');setTimeout(()=>inp.focus(),200);
    el.addEventListener('click',e=>{const x=e.target.dataset.x;if(x==='n')closeLayer();if(x==='y'){const name=inp.value.trim();if(!name){toast('নাম লিখুন');return}const nf={id:uid(),name,color:COLORS[6],pin:false,created:Date.now()};S.folders.push(nf);save();closeLayer();setTimeout(()=>cb(nf.id),140)}});
  }});
  sheet('ফোল্ডার বেছে নিন',items);

function foldersPicker(cur,cb){
  const sel=new Set(cur.filter(fById));
  const el=ov(`<div class="dlg" style="max-width:none;border-radius:16px 16px 0 0;max-height:80vh;overflow:auto"><div class="sht" style="padding:0 0 8px">ফোল্ডার বেছে নিন (একাধিক হতে পারে)</div><div id="fpl"></div><div class="bt" style="margin-top:10px"><button data-x="p">+ নতুন ফোল্ডার</button><button data-x="y" class="pri">ঠিক আছে</button></div></div>`);
  const L=el.querySelector('#fpl');
  const draw=()=>{L.innerHTML=S.folders.map(f=>`<div data-fid="${f.id}" style="display:flex;align-items:center;gap:12px;padding:11px 4px;cursor:pointer"><span style="color:${fcol(f)};display:flex">${I.folder}</span><span style="flex:1">${esc(f.name)}</span><span style="width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;${sel.has(f.id)?'background:var(--acc);color:var(--accText)':'color:transparent'}">✓</span></div>`).join('')||'<div class="empty" style="padding:16px">কোনো ফোল্ডার নেই, নিচে "নতুন ফোল্ডার" চাপুন।</div>'};
  draw();
  el.addEventListener('click',e=>{
    const r=e.target.closest('[data-fid]');
    if(r){const id=r.dataset.fid;if(sel.has(id))sel.delete(id);else sel.add(id);draw();return}
    const x=e.target.dataset.x;
    if(x==='y'){closeLayer();setTimeout(()=>cb([...sel]),140)}
    if(x==='p'){
      closeLayer();
      setTimeout(()=>{
        const d=ov(`<div class="dlg"><div class="sht" style="padding:0 0 4px">নতুন ফোল্ডার</div><input id="fnm3" maxlength="40" placeholder="ফোল্ডারের নাম" autocomplete="off"><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="pri">তৈরি করুন</button></div></div>`,true);
        const inp=d.querySelector('#fnm3');setTimeout(()=>inp.focus(),200);
        d.addEventListener('click',ev=>{
          const z=ev.target.dataset.x;
          if(z==='n'){closeLayer();setTimeout(()=>foldersPicker([...sel],cb),140)}
          if(z==='y'){const name=inp.value.trim();if(!name){toast('নাম লিখুন');return}
            const nf={id:uid(),name,color:COLORS[6],pin:false,created:Date.now()};S.folders.push(nf);save();sel.add(nf.id);
            closeLayer();setTimeout(()=>foldersPicker([...sel],cb),140)}
        });
      },140);
    }
  });
}

/* ---------- নোট এডিটর ---------- */
let cur=null,lastText='',saveT,openSig='',viewT=null;
/* ---------- ফন্ট ---------- */
const DF='"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,Roboto,sans-serif';
const FONTS=[['ডিফল্ট',DF],['নোটো সানস বাংলা','"Noto Sans Bengali",sans-serif'],['নোটো সেরিফ বাংলা','"Noto Serif Bengali",Georgia,serif'],['হিন্দ শিলিগুড়ি','"Hind Siliguri",sans-serif'],['কালপুরুষ','Kalpurush,"Noto Sans Bengali",sans-serif'],['সিয়াম রূপালী','"Siyam Rupali","Noto Sans Bengali",sans-serif'],['সোলায়মানলিপি','SolaimanLipi,"Noto Sans Bengali",sans-serif'],['নিকষ','Nikosh,"Noto Sans Bengali",sans-serif'],['সেরিফ (জর্জিয়া)','Georgia,"Times New Roman",serif'],['মনোস্পেস','"Courier New",monospace']];
const FW=[['স্বাভাবিক',400],['মাঝারি',600],['বোল্ট',800]];
const fontReg=new Set();
function regFont(f){
  if(fontReg.has(f.id))return Promise.resolve(true);
  return new FontFace('cf_'+f.id,'url('+f.data+')').load().then(ff=>{document.fonts.add(ff);fontReg.add(f.id);return true}).catch(()=>false);
}
function fontName(){const v=S.set.font;if(typeof v==='string'&&v[0]==='c'){const f=S.fonts.find(x=>'c'+x.id===v);if(f)return f.name}return FONTS[+v>=0&&+v<FONTS.length?+v:0][0]}
function applyFont(){
  const r=document.documentElement.style,v=S.set.font;let st=DF;
  if(typeof v==='string'&&v[0]==='c'){
    const f=S.fonts.find(x=>'c'+x.id===v);
    if(f){st='"cf_'+f.id+'",'+DF;if(!fontReg.has(f.id))regFont(f).then(ok=>{if(ok)applyFont()})}
  }else st=FONTS[+v>=0&&+v<FONTS.length?+v:0][1];
  r.setProperty('--af',st);r.setProperty('--fw',S.set.fw||600);
}
function addFont(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.ttf,.otf,.woff,.woff2,font/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>2*1024*1024){toast('ফন্ট ফাইল ২ MB এর বেশি হতে পারবে না');return}
    const r=new FileReader();
    r.onload=()=>{
      const o={id:Date.now().toString(36),name:f.name.replace(/\.[^.]+$/,'').slice(0,28),data:r.result};
      regFont(o).then(ok=>{
        if(!ok){toast('ফন্টটি কাজ করছে না');return}
        S.fonts.push(o);S.set.font='c'+o.id;
        try{save()}
        catch(e){S.fonts.pop();S.set.font=0;toast('জায়গা নেই, ফন্ট যোগ হয়নি');return}
        applyFont();render();toast('ফন্ট যোগ হয়েছে');
      });
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function fontSheet(){
  const cv=S.set.font,pick=v=>{S.set.font=v;save();applyFont();render()};
  const items=FONTS.map((f,i)=>({t:f[0]+((cv==null?0:cv)===i?'  ✓':''),ic:'note',f:()=>pick(i)}));
  S.fonts.forEach(f=>items.push({t:f.name+' (নিজের)'+(cv==='c'+f.id?'  ✓':''),ic:'note',f:()=>pick('c'+f.id)}));
  items.push({t:'নিজের ফন্ট যোগ করুন',ic:'palette',f:addFont});
  if(S.fonts.length)items.push({t:'নিজের ফন্ট মুছুন',ic:'trash',f:()=>sheet('কোন ফন্ট মুছবেন?',S.fonts.map(f=>({t:f.name,ic:'trash',f:()=>cfm('"'+f.name+'" ফন্ট মুছে ফেলবেন?','মুছুন',()=>{S.fonts=S.fonts.filter(x=>x.id!==f.id);if(S.set.font==='c'+f.id)S.set.font=0;save();applyFont();render()})})))});
  sheet('ফন্ট',items);
}
function fwSheet(){
  sheet('লেখার ওজন (বোল্ট)',FW.map(w=>({t:w[0]+((S.set.fw||600)===w[1]?'  ✓':''),ic:'note',f:()=>{S.set.fw=w[1];save();applyFont();render()}})));
}
/* ---------- নোটের নিজস্ব ফন্ট (শুধু এডিটরের নোটের লেখা) ---------- */
S.nfonts=S.nfonts||[];
function nfCustom(v){return typeof v==='string'&&v[0]==='c'?S.nfonts.find(x=>'c'+x.id===v):null}
function nfIdx(v){v=+v;return v>0&&v<FONTS.length?v:0}
function nfName(v){const f=nfCustom(v);return f?f.name:FONTS[nfIdx(v)][0]}
const effNF=n=>(n&&n.nfont!=null)?n.nfont:S.set.nfont;
function nfontName(){return nfName(S.set.nfont)}
function applyNoteFont(){
  const e=$('#ed'),v=effNF(cur),f=nfCustom(v);let st=null;
  if(f){st='"cf_'+f.id+'",'+DF;if(!fontReg.has(f.id))regFont(f).then(ok=>{if(ok)applyNoteFont()})}
  else if(nfIdx(v)>0)st=FONTS[nfIdx(v)][1];
  if(st)e.style.setProperty('--nf',st);else e.style.removeProperty('--nf');
  e.classList.toggle('nf',!!st);
}
function nfSet(note,v){
  if(note){if(v===undefined)delete note.nfont;else note.nfont=v;commit()}
  else{S.set.nfont=v;save()}
  applyNoteFont();
}
function addNoteFont(note){
  const inp=document.createElement('input');inp.type='file';inp.accept='.ttf,.otf,.woff,.woff2,font/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>2*1024*1024){toast('ফন্ট ফাইল ২ MB এর বেশি হতে পারবে না');return}
    const r=new FileReader();
    r.onload=()=>{
      const o={id:'n'+Date.now().toString(36),name:f.name.replace(/\.[^.]+$/,'').slice(0,28),data:r.result};
      regFont(o).then(ok=>{
        if(!ok){toast('ফন্টটি কাজ করছে না');return}
        S.nfonts.push(o);
        try{save()}
        catch(e){S.nfonts.pop();toast('জায়গা নেই, ফন্ট যোগ হয়নি');return}
        nfSet(note,'c'+o.id);toast('ফন্ট যোগ হয়েছে');
      });
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function noteFontSheet(note){
  const cv=note?note.nfont:S.set.nfont,pick=v=>nfSet(note,v);
  const items=[];
  if(note)items.push({t:'সবার ফন্ট ব্যবহার করুন ('+nfName(S.set.nfont)+')'+(note.nfont==null?'  ✓':''),ic:'cal',f:()=>nfSet(note,undefined)});
  FONTS.forEach((f,i)=>items.push({t:f[0]+((cv==null?(note?-1:0):cv)===i?'  ✓':''),ic:'note',f:()=>pick(i)}));
  S.nfonts.forEach(f=>items.push({t:f.name+' (নিজের)'+(cv==='c'+f.id?'  ✓':''),ic:'note',f:()=>pick('c'+f.id)}));
  items.push({t:'নিজের ফন্ট যোগ করুন',ic:'palette',f:()=>addNoteFont(note)});
  if(S.nfonts.length)items.push({t:'নিজের ফন্ট মুছুন',ic:'del',f:()=>sheet('কোন ফন্ট মুছবেন?',S.nfonts.map(f=>({t:f.name,ic:'del',f:()=>cfm('"'+f.name+'" ফন্ট মুছে ফেলবেন?','মুছুন',()=>{
    nfRemove(f);applyNoteFont();applyDiaryFont();
  })})))});
  sheet(note?'এই নোটের ফন্ট':'নোটের ফন্ট (সব নোট)',items);
}
/* ---------- নোটের ডান-বাম ফাঁকা ---------- */
const MGD={mgl:8,mgr:16};
const mgOf=k=>{const v=S.set[k];return v==null||isNaN(+v)?MGD[k]:Math.min(48,Math.max(0,+v))};
function applyNoteMargin(){const e=$('#ed');e.style.setProperty('--ml',mgOf('mgl')+'px');e.style.setProperty('--mr',mgOf('mgr')+'px')}
function marginDialog(){
  const rs='style="padding:0;border:0;background:transparent;margin:8px 0 14px"';
  const el=ov(`<div class="dlg" style="max-width:none;border-radius:16px 16px 0 0"><div class="sht" style="padding:0 0 8px">নোটের ডান-বাম ফাঁকা</div><div class="szh"><span>বাম পাশ</span><b id="mlv">${num(mgOf('mgl'))}</b></div><input type="range" class="rs" id="rs-ml" min="0" max="48" step="2" value="${mgOf('mgl')}" ${rs}><div class="szh"><span>ডান পাশ</span><b id="mrv">${num(mgOf('mgr'))}</b></div><input type="range" class="rs" id="rs-mr" min="0" max="48" step="2" value="${mgOf('mgr')}" ${rs}><div class="bt"><button data-x="r">আগের মতো</button><button data-x="y" class="pri">ঠিক আছে</button></div></div>`);

/* ---------- ডাইরির নিজস্ব ফন্ট (শুধু ডাইরি পাতার শিরোনাম ও লেখা) ---------- */
function nfRemove(f){
  const k='c'+f.id;S.nfonts=S.nfonts.filter(x=>x.id!==f.id);
  if(S.set.nfont===k)S.set.nfont=0;
  if(S.set.dfont===k)S.set.dfont=0;
  S.notes.forEach(n=>{if(n.nfont===k)delete n.nfont});
  S.diary.forEach(n=>{if(n.dfont===k)delete n.dfont});
  if(cur&&cur.nfont===k)delete cur.nfont;
  if(dcur&&dcur.dfont===k)delete dcur.dfont;
  save();
}
const effDF=x=>(x&&x.dfont!=null)?x.dfont:S.set.dfont;
function applyDiaryFont(){
  const e=$('#dpage'),v=effDF(dcur),f=nfCustom(v);let st=null;
  if(f){st='"cf_'+f.id+'",'+DF;if(!fontReg.has(f.id))regFont(f).then(ok=>{if(ok)applyDiaryFont()})}
  else if(nfIdx(v)>0)st=FONTS[nfIdx(v)][1];
  if(st)e.style.setProperty('--df',st);else e.style.removeProperty('--df');
  e.classList.toggle('df',!!st);
}
function dfSet(x,v){
  if(x){if(v===undefined)delete x.dfont;else x.dfont=v;dcommit()}
  else{S.set.dfont=v;save()}
  applyDiaryFont();
}
function addDiaryFont(x){
  const inp=document.createElement('input');inp.type='file';inp.accept='.ttf,.otf,.woff,.woff2,font/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;

    const r=new FileReader();
    r.onload=()=>{
      const o={id:'n'+Date.now().toString(36),name:f.name.replace(/\.[^.]+$/,'').slice(0,28),data:r.result};
      regFont(o).then(ok=>{
        if(!ok){toast('ফন্টটি কাজ করছে না');return}
        S.nfonts.push(o);
        try{save()}
        catch(e){S.nfonts.pop();toast('জায়গা নেই, ফন্ট যোগ হয়নি');return}
        dfSet(x,'c'+o.id);toast('ফন্ট যোগ হয়েছে');

function diaryFontSheet(x){
  const cv=x?x.dfont:S.set.dfont,pick=v=>dfSet(x,v);

  if(x)items.push({t:'সবার ফন্ট ব্যবহার করুন ('+nfName(S.set.dfont)+')'+(x.dfont==null?'  ✓':''),ic:'cal',f:()=>dfSet(x,undefined)});

function flipTo(dir,loader){

  const old=snapPage(),ease='cubic-bezier(.45,.05,.25,1)',P0='perspective(1500px) rotateY(0deg)',P1='perspective(1500px) rotateY(-100deg)';
  loader();
  if(dir>0){

  }

let fd=null;
function startFolderDrag(el,x,y){
  const f=fById(el.dataset.id);if(!f)return;
  const rows=[...document.querySelectorAll('#main .fr[data-lp="folder"]')].filter(r=>{const g=fById(r.dataset.id);return g&&!!g.pin===!!f.pin});
  const idx=rows.indexOf(el);
  if(idx<0||rows.length<2){folderSheet(el.dataset.id);return}
  const r0=rows[0].getBoundingClientRect(),r1=rows[1].getBoundingClientRect();
  fd={el,id:el.dataset.id,rows,idx,newIdx:idx,step:(r1.top-r0.top)||(r0.height+10),y0:y,y,sc0:$('#main').scrollTop,moved:false,raf:0};
  el.style.transition='none';el.style.zIndex='30';el.style.willChange='transform';
  el.style.boxShadow='0 10px 24px rgba(0,0,0,.35)';el.style.transform='scale(1.03)';
  rows.forEach(r=>{if(r!==el){r.style.transition='transform .16s ease';r.style.willChange='transform'}});
  document.body.classList.add('fdragging');
  fdTick();
}
function fdTick(){
  const d=fd;if(!d)return;
  const m=$('#main'),mr=m.getBoundingClientRect();
  let sp=0;
  if(d.y<mr.top+70)sp=-Math.min(16,(mr.top+70-d.y)/4);
  else if(d.y>mr.bottom-70)sp=Math.min(16,(d.y-(mr.bottom-70))/4);
  if(sp)m.scrollTop+=sp;
  const dy=(d.y-d.y0)+(m.scrollTop-d.sc0);
  if(Math.abs(dy)>8)d.moved=true;
  d.el.style.transform='translateY('+dy+'px) scale(1.03)';
  const ni=Math.max(0,Math.min(d.rows.length-1,Math.round(d.idx+dy/d.step)));
  if(ni!==d.newIdx){
    d.newIdx=ni;
    d.rows.forEach((r,j)=>{
      if(j===d.idx)return;
      let off=0;
      if(d.idx<ni&&j>d.idx&&j<=ni)off=-d.step;
      else if(d.idx>ni&&j>=ni&&j<d.idx)off=d.step;
      r.style.transform=off?'translateY('+off+'px)':'';
    });
    try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  }
  d.raf=requestAnimationFrame(fdTick);
}
function endFolderDrag(){
  if(!fd)return;
  const d=fd;fd=null;cancelAnimationFrame(d.raf);
  document.body.classList.remove('fdragging');
  const reset=()=>d.rows.forEach(r=>{r.style.transition='';r.style.transform='';r.style.zIndex='';r.style.boxShadow='';r.style.willChange=''});
  if(!d.moved){reset();folderSheet(d.id);return}
  if(d.newIdx===d.idx){d.el.style.transition='transform .15s ease';d.el.style.transform='';setTimeout(reset,170);return}
  d.el.style.transition='transform .15s ease';
  d.el.style.transform='translateY('+((d.newIdx-d.idx)*d.step)+'px)';
  setTimeout(()=>{
    const all=[...document.querySelectorAll('#main .fr[data-lp="folder"]')].map(r=>r.dataset.id);
    const grp=d.rows.map(r=>r.dataset.id),start=all.indexOf(grp[0]);
    const order=grp.slice();const mv=order.splice(d.idx,1)[0];order.splice(d.newIdx,0,mv);
    all.splice(start,order.length,...order);
    const byId=new Map(S.folders.map(f=>[f.id,f]));
    const next=all.map(id=>byId.get(id)).filter(Boolean);
    S.folders.forEach(f=>{if(!next.includes(f))next.push(f)});
    const was=S.set.fsort;
    S.folders=next;S.set.fsort='manual';save();render();
    if(was!=='manual')toast('এখন থেকে ফোল্ডার হাতে সাজানো থাকবে');
  },160);
}

const KEEPC={DEFAULT:'#ffffff',RED:'#f48fb1',ORANGE:'#ffb74d',YELLOW:'#fff176',GREEN:'#aed581',TEAL:'#80cbc4',BLUE:'#4fc3f7',CERULEAN:'#4fc3f7',PURPLE:'#b39ddb',PINK:'#f48fb1',BROWN:'#fcf6bd',GRAY:'#b0bec5'};
function keepImportDlg(){
  const el=ov(`<div class="dlg"><div class="sht" style="padding:0 0 4px">Google Keep থেকে ইম্পোর্ট</div><p>Google Takeout থেকে Keep এক্সপোর্ট করে ZIP খুলুন, তারপর সব .json ফাইল একসাথে বাছুন। প্রতিটি লেবেল একটা ফোল্ডার হবে, রং ও পিন আসবে, আর্কাইভ করা নোট আর্কাইভে যাবে। বর্তমান নোট মুছবে না, ট্র্যাশের নোট বাদ যাবে।</p><input type="file" id="kpf" accept=".json,application/json" multiple><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="pri">ইম্পোর্ট</button></div></div>`,true);
  el.addEventListener('click',async e=>{
    const x=e.target.dataset.x;
    if(x==='n')closeLayer();
    if(x!=='y')return;
    const files=[...el.querySelector('#kpf').files];
    if(!files.length){toast('ফাইল বাছুন');return}
    let a=0,skip=0,bad=0;
    const key=(t,b,c)=>t+'\u0001'+b+'\u0001'+c;
    const have=new Set(S.notes.map(n=>key(n.title||'',n.body||'',n.created)));
    const fid=nm=>{let f=S.folders.find(q=>q.name===nm);if(!f){f={id:uid(),name:nm,color:COLORS[6],pin:false,created:Date.now()};S.folders.push(f)}return f.id};
    const us=v=>v?Math.round(Number(v)/1000):Date.now();
    for(const f of files){
      try{
        const d=JSON.parse(await f.text());
        if(!d||typeof d!=='object'||Array.isArray(d)||!('textContent' in d||'listContent' in d||'title' in d)){bad++;continue}
        if(d.isTrashed){skip++;continue}
        let body=d.textContent||'';
        if(Array.isArray(d.listContent))body=d.listContent.map(i=>(i.isChecked?'☑ ':'☐ ')+(i.text||'')).join('\n');
        const title=d.title||'';
        if(!title&&!body.trim()){skip++;continue}
        const created=us(d.createdTimestampUsec),updated=us(d.userEditedTimestampUsec||d.createdTimestampUsec);
        const k=key(title,body,created);
        if(have.has(k)){skip++;continue}
        have.add(k);
        const names=(d.labels||[]).map(l=>l&&l.name).filter(Boolean);
        const n={id:uid(),title,body,color:KEEPC[d.color]||'#ffffff',pin:!!d.isPinned,archived:!!d.isArchived,created,updated};
        setNF(n,[...new Set(names)].map(fid));
        S.notes.push(n);a++;
      }catch(_){bad++}
    }
    save();closeLayer();render();
    toast(num(a)+'টি নোট যোগ হয়েছে'+(skip?', '+num(skip)+'টি বাদ (ট্র্যাশ/খালি/আগে থেকে আছে)':'')+(bad?', '+num(bad)+'টি ফাইল পড়া যায়নি':''));
  });
}

function importDlg(){
  const el=ov(`<div class="dlg"><div class="sht" style="padding:0 0 4px">রিস্টোর</div><p>ব্যাকআপের লেখা এখানে পেস্ট করুন অথবা ফাইল বেছে নিন। বর্তমান নোট মুছবে না, নতুনগুলো যোগ হবে।</p><textarea id="im" placeholder="ব্যাকআপ পেস্ট করুন"></textarea><input type="file" id="imf" accept=".json,application/json"><div class="bt"><button data-x="n">বাতিল</button><button data-x="y" class="pri">রিস্টোর</button></div></div>`,true);
  const ta=el.querySelector('#im');
  el.querySelector('#imf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result};r.readAsText(f)});
  el.addEventListener('click',e=>{
    const x=e.target.dataset.x;
    if(x==='n')closeLayer();
    if(x==='y'){
      try{
        const d=JSON.parse(ta.value);if(!d||!Array.isArray(d.notes))throw 0;
        const ids=new Set(S.notes.map(n=>n.id)),fids=new Set(S.folders.map(f=>f.id));let a=0;
        (d.folders||[]).forEach(f=>{if(f&&f.id&&!fids.has(f.id)){S.folders.push(f)}});
        d.notes.forEach(n=>{if(n&&n.id&&!ids.has(n.id)){S.notes.push(n);a++}});
        const dids=new Set(S.diary.map(x=>x.id));
        (d.diary||[]).forEach(x=>{if(x&&x.id&&!dids.has(x.id)){S.diary.push(x);a++}});
        const nfi=new Set((S.nfonts||[]).map(f=>f.id));S.nfonts=S.nfonts||[];(d.nfonts||[]).forEach(f=>{if(f&&f.id&&!nfi.has(f.id))S.nfonts.push(f)});
        const fti=new Set((S.fonts||[]).map(f=>f.id));S.fonts=S.fonts||[];(d.fonts||[]).forEach(f=>{if(f&&f.id&&!fti.has(f.id))S.fonts.push(f)});
        if(d.set&&typeof d.set==='object'&&!Array.isArray(d.set))Object.assign(S.set,d.set);
        try{applyVars()}catch(_){}
        save();closeLayer();render();toast(num(a)+'টি নতুন আইটেম যোগ হয়েছে');
      }catch(_){toast('ব্যাকআপটি সঠিক নয়')}
    }
  });
}

/* ---------- ক্যালেন্ডার (একই ফাইলের ভেতর) ---------- */
const Cal=(()=>{
  const cnum=n=>{try{return Number(n).toLocaleString('bn-BD',{useGrouping:false})}catch(e){return n}};
  const pad=n=>String(n).padStart(2,'0');
  const ymd=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
  const noon=(y,m,d)=>new Date(y,m,d,12);
  const el=$('#calv');
  let TY,TM,TD,TODAY,vy,vm,isOpen=false;
  function setToday(){const n=new Date();TY=n.getFullYear();TM=n.getMonth();TD=n.getDate();TODAY=ymd(TY,TM,TD)}
  setToday();vy=TY;vm=TM;

  /* বাংলা তারিখ (বাংলাদেশের সংশোধিত পঞ্জিকা) */
  const BM=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
  const BS=[[3,14,0],[4,15,1],[5,15,2],[6,16,3],[7,16,4],[8,16,5],[9,16,6],[10,15,7],[11,15,8],[0,14,9],[1,13,10],[2,15,11]];
  function bangla(dt){
    const y=dt.getFullYear(),d0=noon(y,dt.getMonth(),dt.getDate());
    let best=null;
    for(const yy of [y-1,y])for(const [m,dd,bi] of BS){
      const st=noon(yy,m,dd);
      if(st<=d0&&(!best||st>best.st))best={st,bi,yy};
    }
    const day=Math.round((d0-best.st)/86400000)+1;
    const sy=best.st.getFullYear();
    const year=best.st>=noon(sy,3,14)?sy-593:sy-594;
    return{day,month:best.bi,year};
  }
  const banglaStr=b=>`${cnum(b.day)} ${BM[b.month]} ${cnum(b.year)}`;

  /* হিজরি (আরবি) তারিখ */
  const HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
  let adj=-1;
  try{const a=localStorage.getItem('hijriAdj');if(a!==null)adj=+a||0}catch(e){}
  function hijri(dt){
    const d=noon(dt.getFullYear(),dt.getMonth(),dt.getDate()+adj);
    try{
      const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
      const p=f.formatToParts(d),g=t=>+p.find(x=>x.type===t).value;
      const r={day:g('day'),month:g('month')-1,year:g('year')};
      if(!(r.day>0&&r.month>=0&&r.month<12))return null;
      return r;
    }catch(e){return null}
  }
  const hijriStr=h=>h?`${cnum(h.day)} ${HM[h.month]} ${cnum(h.year)} হিজরি`:'এই ডিভাইসে আরবি তারিখ পাওয়া যায়নি';

  /* দিবস */
  const GD={
  '01-01':'ইংরেজি নববর্ষ','02-21':'শহীদ দিবস ও আন্তর্জাতিক মাতৃভাষা দিবস','03-08':'আন্তর্জাতিক নারী দিবস','03-22':'বিশ্ব পানি দিবস',
  '03-25':'গণহত্যা দিবস','03-26':'মহান স্বাধীনতা দিবস','04-07':'বিশ্ব স্বাস্থ্য দিবস','04-22':'বিশ্ব বসুন্ধরা দিবস','05-01':'মে দিবস (আন্তর্জাতিক শ্রমিক দিবস)',
  '05-03':'বিশ্ব গণমাধ্যম স্বাধীনতা দিবস','06-05':'বিশ্ব পরিবেশ দিবস','06-20':'বিশ্ব শরণার্থী দিবস','07-11':'বিশ্ব জনসংখ্যা দিবস','08-12':'আন্তর্জাতিক যুব দিবস',
  '09-08':'আন্তর্জাতিক সাক্ষরতা দিবস','09-21':'আন্তর্জাতিক শান্তি দিবস','09-27':'বিশ্ব পর্যটন দিবস','10-01':'আন্তর্জাতিক প্রবীণ দিবস','10-05':'বিশ্ব শিক্ষক দিবস',

  const cs=getComputedStyle(ta);
  ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight','wordSpacing','paddingTop','paddingRight','paddingBottom','paddingLeft','tabSize'].forEach(k=>{el.style[k]=cs[k]});
  el.style.boxSizing='border-box';
  el.style.left=ta.offsetLeft+'px';el.style.top=ta.offsetTop+'px';
  el.style.width=ta.clientWidth+'px';el.style.height=ta.clientHeight+'px';
  const c=(cs.color.match(/\d+/g)||[0,0,0]).map(Number);
  el.style.setProperty('--hl',(0.299*c[0]+0.587*c[1]+0.114*c[2])/255>0.6?'#b87900':'#ffe94d');
  el.scrollTop=ta.scrollTop;
}
function hlClear(){hlQ='';const el=$('#ehl');if(el){el.innerHTML='';el.style.display='none'}}
function hlRender(first){
  const el=$('#ehl'),ta=$('#eb');if(!el||!ta)return;

    out+=esc(v.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length;
  }

const UR={a:[],i:0,t:0,lock:false};

  const ta=$('#eb'),u=$('#urU'),r=$('#urR');if(!ta||!u||!r)return;

function urPush(){
  clearTimeout(UR.t);if(UR.lock)return;
  const ta=$('#eb'),last=UR.a[UR.i];if(last&&last.v===ta.value){urBtns();return}
  UR.a=UR.a.slice(0,UR.i+1);UR.a.push({v:ta.value,s:ta.selectionStart,e:ta.selectionEnd});
  const cap=Math.max(20,Math.min(200,Math.floor(2e6/Math.max(1,ta.value.length))));
  while(UR.a.length>cap)UR.a.shift();
  UR.i=UR.a.length-1;urBtns();

/* ---------- কিবোর্ড খুললে লেখার জায়গা কিবোর্ডের ওপরে রাখা ---------- */
function caretBottom(ta){
  const cs=getComputedStyle(ta),d=document.createElement('div');
  ['boxSizing','width','fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight','wordSpacing','textIndent','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','wordBreak','overflowWrap','tabSize'].forEach(k=>{d.style[k]=cs[k]});
  d.style.cssText+=';position:absolute;visibility:hidden;top:0;left:-9999px;white-space:pre-wrap;overflow:hidden;height:auto';
  d.textContent=ta.value.slice(0,ta.selectionEnd);
  const sp=document.createElement('span');sp.textContent='\u200b';d.appendChild(sp);
  document.body.appendChild(d);const y=sp.offsetTop+sp.offsetHeight;document.body.removeChild(d);return y;
}
function eaGrow(){
  const ta=$('#eb'),sc=$('#ebody'),ed=$('#ed');if(!ta||!sc||!ed||!ed.classList.contains('on'))return;

function keepCaret(ta){
  try{
    const n=ta.value.length;
    if(n<20000){revealCaret(ta);return}
    if(ta.selectionEnd>=n-1){const sc=$('#ebody');sc.scrollTop=sc.scrollHeight}else revealCaret(ta);
  }catch(e){}
}
function revealCaret(ta){
  try{
    const sc=$('#ebody'),y=ta.offsetTop+caretBottom(ta),lh=parseFloat(getComputedStyle(ta).lineHeight)||28,vh=sc.clientHeight;
    if(y>sc.scrollTop+vh-lh*0.5)sc.scrollTop=y-vh+lh*0.5;
    else if(y-lh<sc.scrollTop)sc.scrollTop=Math.max(0,y-lh*1.5);
  }catch(e){}
}

})();
